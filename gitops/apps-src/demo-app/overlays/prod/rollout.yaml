# PROD overlay: CANARY Rollout (bullet 2) with Prometheus AnalysisTemplate.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      serviceAccountName: demo-app
      containers:
        - name: demo-app
          image: "us-central1-docker.pkg.dev/gcplearn9-498315/gitops-poc-apps/demo-app:v1"
          ports:
            - containerPort: 8080
          env:
            - name: API_KEY_SECRET # mounted from ESO-projected secret — bullet 6
              valueFrom:
                secretKeyRef:
                  name: demo-api-key
                  key: api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
  strategy:
    canary:
      stableService: demo-app-stable
      canaryService: demo-app-canary
      steps:
        - setWeight: 10
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service
                value: demo-app-canary
        - setWeight: 30
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service
                value: demo-app-canary
        - setWeight: 60
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
            args:
              - name: service
                value: demo-app-canary
        - setWeight: 100
      abortScaleDownDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-stable
  namespace: demo
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-canary
  namespace: demo
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Prometheus-backed analysis: error-ratio gate over 1m windows — this is the
# bullet-5 automated-rollback trigger (failure => abort => back to stable).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: demo
spec:
  args:
    - name: service
  metrics:
    - name: success-ratio
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.95
      failureLimit: 2 # 2 consecutive failures => abort rollout (rollback)
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service}}",code!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{service="{{args.service}}"}[1m]))
